{{- if eq .Params.sectionnav true }}
<nav aria-label="Page-Level Navigation" class="section-nav">
  <ul>
    {{- range (index .Site.Data.nav .Section) }} {{- range . }}
    <li>
      <a href="{{- index . 0 }}" class="section-link">{{- index . 1 }}</a>
    </li>
    {{- end }} {{- end }}
  </ul>
</nav>
{{- end }}
